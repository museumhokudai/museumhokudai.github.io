<html>
    <head>
        <title>Default Advanced Marker5</title>

        <link rel="stylesheet" type="text/css" href="./style.css" />
    </head>
    <body>
        <form id="sendUrl">
			<p>
				<input name="filename" type="url" id="myFile" size="40" value="https://museumhokudai.github.io/testPosition.json"/>
			</p>
			<p class="button">
				<button type="submit">マップ表示</button> 
			</p>
		</form>
        <script>
               document.getElementById('sendUrl').addEventListener('submit', function(e) {
	                   e.preventDefault();
                   const fileUrl = document.getElementById('myFile').value;
                   // エンコードして次のページへ遷移
                   window.location.href = `showmap.html?file=${encodeURIComponent(fileUrl)}`;
               });
		</script>
    </body>
</html>
